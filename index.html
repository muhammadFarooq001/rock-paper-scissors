<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock paper scissor game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="title">Rock Paper Scissor</div>
    <div id="images">
        <img id="rock" class="image-class" src="./images/rock.png" alt="rock">
        <img id="paper" class="image-class" src="./images/paper.png" alt="paper">
        <img id="scissor" class="image-class" src="./images/scissor.png" alt="scissor">
    </div>
    <div id="score-box">
        <div id="player-one">
            <div id="score1" ><p>0</p></div>
            <div id="name1"><p>Player 1</p></div>
        </div>
        <div id="player-two">
            <div id="score2"><p>0</p></div>
            <div id="name2"><p>Player 2</p></div>
        </div>
    </div>
    <div id="result-box">
        <p id="result">Let's Play</p>
    </div>
    <script src="practice.js"></script>
    
</body>
</html>

<script>
  // Simple RPS logic with modal on win
  const choices = document.querySelectorAll('.choice');
  const playerScoreEl = document.getElementById('playerScore');
  const cpuScoreEl = document.getElementById('cpuScore');
  const resultText = document.getElementById('resultText');

  let playerScore = 0;
  let cpuScore = 0;

  const overlay = document.getElementById('winOverlay');
  const modalUserMove = document.getElementById('modalUserMove');
  const modalCpuMove = document.getElementById('modalCpuMove');
  const modalClose = document.getElementById('modalClose');
  const modalCloseBtn = document.getElementById('modalCloseBtn');
  const modalPlayAgain = document.getElementById('modalPlayAgain');

  let autoCloseTimer = null;

  function cpuChoice(){
    const arr = ['rock','paper','scissors'];
    return arr[Math.floor(Math.random()*3)];
  }

  function determineResult(player, cpu){
    if(player === cpu) return 'tie';
    if(
      (player === 'rock' && cpu === 'scissors') ||
      (player === 'paper' && cpu === 'rock') ||
      (player === 'scissors' && cpu === 'paper')
    ) return 'win';
    return 'lose';
  }

  function showWinModal(playerMove, cpuMove){

    modalUserMove.textContent = capitalize(playerMove);
    modalCpuMove.textContent = capitalize(cpuMove);

    // show overlay
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');

    // set focus for accessibility
    modalPlayAgain.focus();

    // auto close after 4 seconds
    clearTimeout(autoCloseTimer);
    autoCloseTimer = setTimeout(hideModal, 4000);
  }

  function hideModal(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    clearTimeout(autoCloseTimer);
  }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

        playerScore++;
        resultText.textContent = `You win! ${capitalize(playerMove)} beats ${capitalize(cpuMove)}`;
        // show modal on user win
        showWinModal(playerMove, cpuMove);
      } else if(res === 'lose'){
        cpuScore++;
        resultText.textContent = `You lose… ${capitalize(cpuMove)} beats ${capitalize(playerMove)}`;
      } else {
        resultText.textContent = "It's a tie!";
      }

      // update scoreboard
      playerScoreEl.textContent = playerScore;
      cpuScoreEl.textContent = cpuScore;
    });
  });

    if(e.target === overlay) hideModal();
  });

  // close with Escape

  });
</script>
